<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kötészet</title>
<meta name="description" content="Könyvoldalak fotóiból kereshető PDF és EPUB, magyar szövegfelismeréssel.">
<meta name="theme-color" content="#1E5841">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<style>
@font-face{font-family:"Literata";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/literata-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Literata";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/literata-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Literata";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/literata-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Literata";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/literata-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* Layout: one calm reading column; the book is a stack of chapter "signatures", each a grid of page thumbnails. Bottle-green bookcloth with gilt for status. */
:root{
  --bg:#EDF1EE; --surface:#F9FBF9; --ink:#1A2520; --muted:#5A6A61; --line:#C9D3CD;
  --accent:#1E5841; --accent-ink:#FFFFFF; --accent-soft:#D6E6DD;
  --gilt:#9C6E1F; --ok:#2C7549; --danger:#A23628;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211D; --ink:#E3EAE5; --muted:#93A39A; --line:#2B3731;
  --accent:#6DB892; --accent-ink:#0C1912; --accent-soft:#1F3329;
  --gilt:#D8AC58; --ok:#76C493; --danger:#E27B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --ink:#E3EAE5; --muted:#93A39A; --line:#2B3731;
  --accent:#6DB892; --accent-ink:#0C1912; --accent-soft:#1F3329;
  --gilt:#D8AC58; --ok:#76C493; --danger:#E27B6B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.mast h1{font-size:30px;letter-spacing:-.01em}
.mast h1 span{color:var(--accent)}
.mast p{margin:0;color:var(--muted);font-size:13.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{min-height:32px;padding:5px 10px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 200px}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}

/* library */
.newbook{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.books{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.book:first-child{border-top:1px solid var(--line)}
.book:hover .book-title{color:var(--accent)}
.spine{width:12px;height:52px;border-radius:2px;background:var(--accent);box-shadow:inset -3px 0 0 rgba(0,0,0,.18)}
.book-title{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.25}
.book-meta{font-size:13px;color:var(--muted)}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;max-width:220px}
.meter i{display:block;height:100%;background:var(--gilt)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.steps li{display:flex;gap:12px}
.steps b{font-family:var(--f-display);font-size:26px;color:var(--gilt);line-height:1}
.steps p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.steps h3{font-size:16px}

/* book */
.bookhead{display:flex;flex-direction:column;gap:6px}
.bookhead input{border:none;background:transparent;padding:2px 0;border-bottom:1px dashed transparent;width:100%}
.bookhead input:hover,.bookhead input:focus{border-bottom-color:var(--line);outline:none}
#bTitle{font-family:var(--f-display);font-size:28px;font-weight:600}
#bAuthor{font-size:16px;color:var(--muted)}
.ocrbar{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gilt);transition:width .25s}

.chap{display:flex;flex-direction:column;gap:12px}
.chap-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.chap-head input{flex:1 1 180px;min-width:0;border:none;background:transparent;font-family:var(--f-display);font-size:19px;font-weight:600;padding:4px 0}
.chap-head input:focus{outline:none;border-bottom:1px dashed var(--line)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--surface);cursor:pointer;padding:0;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;left:4px;bottom:4px;background:var(--surface);color:var(--ink);font-size:11px;padding:1px 5px;border-radius:3px}
.thumb .st{position:absolute;right:5px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--line)}
.st.done{background:var(--ok)} .st.low{background:var(--gilt)} .st.error{background:var(--danger)}
.st.working{background:var(--gilt);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.thumb.cover::after{content:"borító";position:absolute;top:4px;left:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:3px}
.thumb .role{position:absolute;top:4px;left:4px;font-size:10px;background:var(--ink);color:var(--surface);padding:0 5px;border-radius:3px;opacity:.85}
.thumb.r-image img,.thumb.r-pdfOnly img,.thumb.r-back img{opacity:.75}
.st.img{background:var(--surface);border-color:var(--muted)}
.rolesel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;min-height:34px;font-size:14px}
.thumb .pwarn{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:var(--gilt);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ed-warn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:color-mix(in srgb,var(--gilt) 14%,var(--surface));border-bottom:1px solid var(--line);font-size:14px}
label.btn.disabled{opacity:.45;pointer-events:none}
.corners{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.cstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;overflow:hidden}
.cbox{position:relative;flex:none}
.cbox img{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;pointer-events:none}
.cbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cbox polygon{fill:color-mix(in srgb,var(--gilt) 18%,transparent);stroke:var(--gilt);stroke-width:2.5}
.cbox .hd{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid var(--gilt);background:color-mix(in srgb,var(--surface) 60%,transparent);touch-action:none;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cbox .hd::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--gilt)}
.addtile{aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;font-size:13px;text-align:center;padding:4px}
.addtile:hover{border-color:var(--accent);color:var(--accent)}
.addtile b{font-size:24px;font-weight:400;line-height:1}
.addtile input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .st{position:static;border:none;width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.legend .st.img{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}

.export{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.checks small{display:block;color:var(--muted);font-size:12.5px}
.danger-zone{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* page editor */
.editor{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ed-top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-top .t{flex:1 1 auto;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-body{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ed-img{overflow:auto;background:var(--surface);border-right:1px solid var(--line);min-width:0}
.ed-img img{width:100%;display:block}
.ed-text{display:flex;flex-direction:column;min-width:0;min-height:0}
.ed-text textarea{flex:1;border:none;resize:none;padding:16px;background:var(--bg);font-family:var(--f-display);font-size:16px;line-height:1.6;min-height:0}
.ed-text textarea:focus{outline:none}
.ed-bottom{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.ed-bottom .sp{flex:1}
@media (max-width:700px){
  .ed-body{grid-template-columns:1fr;grid-template-rows:42% 58%}
  .ed-img{border-right:none;border-bottom:1px solid var(--line)}
}

.modal{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal .box p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;align-self:center}
.sync.err{background:var(--danger);color:var(--surface)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;vertical-align:middle}
.pill.active{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--gilt);color:var(--surface)}
.thumb.txt{text-align:left;cursor:pointer}
.thumb .snip{display:block;padding:8px 7px 22px;font-family:var(--f-display);font-size:9.5px;line-height:1.35;color:var(--muted);overflow:hidden;height:100%;word-break:break-word}
.ed-body.noimg{grid-template-columns:1fr;grid-template-rows:1fr}
.ed-body.noimg .ed-img{display:none}
.lib-group{display:flex;flex-direction:column;gap:10px}
.finish{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{margin:0}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1}
.addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:8px;border:1.5px dashed var(--line);color:var(--accent);font-weight:600;cursor:pointer;text-align:center;padding:6px}
.addbtn:hover{border-color:var(--accent)}
.addbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.done-steps{display:flex;flex-direction:column;gap:12px}
.done-step{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.done-step b.num{font-family:var(--f-display);font-size:22px;color:var(--gilt)}
.done-step.ok{border-color:var(--ok)}
.done-step .ck{color:var(--ok);font-weight:600;font-size:13px}
.sub{font-size:13px;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px}
.modal .box{max-width:460px}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="editorRoot"></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="tess/tesseract.min.js"></script>
<script src="clean.js"></script>
<script src="image.js"></script>
<script src="app.js"></script>
</body>
</html>
